# Ruff config mirrors the Stitch monorepo lint rules for stylistic consistency.
line-length = 100
target-version = "py311"
# _vendor/ is regenerated by stitch_plugin_tools — never lint or hand-edit it.
extend-exclude = ["_vendor"]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
# E501: line length handled by the formatter; B008: parity with core.
ignore = ["E501", "B008"]
